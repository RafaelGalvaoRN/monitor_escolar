<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Estatísticas por quesito · Monitor Escolar</title>
  <meta name="description" content="Gráficos com as respostas dos gestores a cada pergunta do formulário do Monitor Escolar." />
  <meta name="theme-color" content="#082c48" />
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml" />
  <script>try{var t=localStorage.getItem('me-tema');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css" />
  <link rel="stylesheet" href="style/tema.css" />
</head>
<body>
  <div id="header-placeholder"></div>
  <script src="layout.js"></script>

  <main>
    <section class="page-head">
      <div class="wrap">
        <div class="crumbs"><a href="index.html">Início</a><span>›</span><span>Dados</span><span>›</span><span>Por quesito</span></div>
        <h1>Estatísticas por quesito</h1>
        <p class="lead">Escolha uma pergunta do formulário dos gestores para ver como as escolas responderam.</p><div class="hero-actions"><a class="btn ghost" href="estatisticas_eixo.html"><i class="fas fa-layer-group"></i> Ver por eixo</a></div>
      </div>
    </section>

    <section class="wrap page-body">
      <div class="picker">
        <div class="field">
          <label for="colunaSelect">Pergunta do questionário</label>
          <select id="colunaSelect">
            <option value="">Carregando...</option>
          </select>
        </div>
        <button id="btnPlotar" class="btn" type="button"><i class="fas fa-chart-bar"></i> Gerar gráficos</button>
      </div>

      <div class="grid two" style="margin-top:16px">
        <div class="card chart-card">
          <h3 id="tituloGrafico1">Carregando dados...</h3>
          <div class="chart-wrap"><canvas id="graficoPizza1"></canvas></div>
        </div>
        <div class="card chart-card">
          <h3 id="tituloGrafico2">Carregando dados...</h3>
          <div class="chart-wrap"><canvas id="graficoBarra1"></canvas></div>
        </div>
      </div>

      <div id="mensagens" style="margin-top: 20px;"></div>
    </section>
  </main>

  <div id="footer-placeholder"></div>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="estatisticas.js"></script>
  <script src="estatisticas-main.js"></script>
</body>
</html>
